name: Enterprise-HQ Parent Company Observer

on:
  push:
    branches:
      - company/hq-lease-recovery-contract-verified-2026-11-07
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: read

concurrency:
  group: enterprise-hq-parent-company-observer
  cancel-in-progress: false

jobs:
  observe-parent-company:
    name: Read-only parent-company status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout sanitized public worker
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test aggregate observer
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_company_observer.py'
      - name: Test deterministic task contract
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_task_contract.py'
      - name: Test local durable proposal ledger
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_task_ledger.py'
      - name: Test verification receipt envelope
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_verification_receipt.py'
      - name: Test deterministic lease contract
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_lease_contract.py'
      - name: Test persistent lease proposal ledger
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_lease_ledger.py'
      - name: Test deterministic resource-budget envelope
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_resource_budget.py'
      - name: Test task-bound budget persistence
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_budgeted_task_ledger.py'
      - name: Test persistent untrusted verification receipts
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_verification_ledger.py'
      - name: Test persistent successor-lease recovery proposals
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_recovery_ledger.py'
      - name: Test fail-closed principal attestation contract
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_principal_contract.py'
      - name: Test persistent principal nonce replay protection
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_principal_replay_ledger.py'
      - name: Test fail-closed principal trust-policy envelope
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_principal_trust_policy.py'
      - name: Test policy-bound principal verifier adapter
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_principal_policy_source.py'
      - name: Test persistent principal policy version and revocation history
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_principal_policy_ledger.py'
      - name: Test bounded company evidence integrity
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_evidence_verifier.py'
      - name: Test reviewer-attestation-bound evidence verification ledger
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_evidence_ledger.py'
      - name: Test deterministic unified-ledger integrity checkpoint
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_ledger_integrity_snapshot.py'
      - name: Test metadata-only ledger restore equivalence
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_ledger_restore_verifier.py'
      - name: Test bounded metadata-only backup inventory and retention
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_backup_inventory.py'
      - name: Test cross-ledger backup-set lineage reconciliation
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_backup_set_reconciliation.py'
      - name: Test cross-ledger backup-set restore equivalence
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_backup_set_restore_verifier.py'
      - name: Test persistent cross-ledger backup-set restoration receipts
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_backup_set_restore_ledger.py'
      - name: Test non-destructive cross-ledger backup-set retention history
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_backup_set_retention_ledger.py'
      - name: Test cross-ledger backup-set retention restoration equivalence
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_backup_set_retention_restore_verifier.py'
      - name: Test sanitized observer artifact contract
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_company_observer_artifact.py'
      - name: Test read-only company observer safety contract
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_company_observer_policy.py'
      - name: Test public workflow separation inventory
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_public_workflow_boundary.py'
      - name: Test deterministic observer freshness contract
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_observer_freshness.py'
      - name: Test persistent observer freshness receipt ledger
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_observer_freshness_ledger.py'
      - name: Test verified observer freshness backup and restoration
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_observer_freshness_backup.py'
      - name: Test persistent observer freshness backup lineage receipts
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_observer_freshness_backup_receipts.py'
      - name: Test read-only observer freshness backup availability
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_observer_freshness_backup_availability.py'
      - name: Test persistent observer freshness backup availability history
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_observer_freshness_backup_availability_ledger.py'
      - name: Test read-only backup availability reconciliation
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_backup_availability_reconciliation.py'
      - name: Test explicit backup artifact binding contract
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_backup_artifact_binding.py'
      - name: Test persistent backup-artifact binding receipt ledger
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_backup_artifact_binding_ledger.py'
      - name: Test verified binding-to-receipt orchestration
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_backup_artifact_binding_service.py'
      - name: Test independent binding receipt snapshot verification
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_backup_artifact_binding_snapshot.py'
      - name: Test cross-ledger backup generation continuity
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_backup_generation_continuity.py'
      - name: Test backup predecessor availability
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_backup_predecessor_availability.py'
      - name: Test aggregate backup recovery readiness
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_backup_recovery_readiness.py'
      - name: Test persistent aggregate recovery-readiness history
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_backup_recovery_readiness_ledger.py'
      - name: Test independent recovery-readiness history snapshot
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_backup_recovery_readiness_snapshot.py'
      - name: Test persisted recovery-readiness service integration
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_backup_recovery_readiness_service.py'
      - name: Test independent recovery-readiness transition history
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_backup_recovery_readiness_transitions.py'
      - name: Test close-reopen recovery-readiness restart adapter
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_backup_recovery_readiness_restart.py'
      - name: Test interrupted recovery-readiness append reconciliation
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_backup_recovery_readiness_interruption.py'
      - name: Test recovery-readiness SQLite crash points
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_backup_recovery_readiness_crash_points.py'
      - name: Test existing-history recovery after SQLite crash points
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_backup_recovery_readiness_existing_history_crash_points.py'
      - name: Test atomic recovery-readiness schema initialization
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_backup_recovery_readiness_schema_init_crash_points.py'
      - name: Read private HQ metadata and emit aggregate-only report
        env:
          ENTERPRISE_HQ_READ_TOKEN: ${{ secrets.ENTERPRISE_HQ_READ_TOKEN }}
        run: python scripts/enterprise_hq_company_observer.py --output "$RUNNER_TEMP/enterprise-hq-company-summary.json"
      - name: Validate aggregate-only observer artifact
        run: python scripts/enterprise_hq_company_observer_artifact.py --report "$RUNNER_TEMP/enterprise-hq-company-summary.json"
      - name: Store aggregate-only report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-hq-parent-company-summary-${{ github.run_id }}
          path: ${{ runner.temp }}/enterprise-hq-company-summary.json
          if-no-files-found: ignore
          retention-days: 1
