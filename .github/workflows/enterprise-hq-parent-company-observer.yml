name: Enterprise-HQ Parent Company Observer

on:
  push:
    branches:
      - company/hq-lease-recovery-contract-verified-2026-11-07
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: read

concurrency:
  group: enterprise-hq-parent-company-observer
  cancel-in-progress: false

jobs:
  observe-parent-company:
    name: Read-only parent-company status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout sanitized public worker
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test aggregate observer
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_company_observer.py'
      - name: Test deterministic task contract
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_task_contract.py'
      - name: Test local durable proposal ledger
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_task_ledger.py'
      - name: Test verification receipt envelope
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_verification_receipt.py'
      - name: Test deterministic lease contract
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_lease_contract.py'
      - name: Test persistent lease proposal ledger
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_lease_ledger.py'
      - name: Test deterministic resource-budget envelope
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_resource_budget.py'
      - name: Test task-bound budget persistence
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_budgeted_task_ledger.py'
      - name: Test persistent untrusted verification receipts
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_verification_ledger.py'
      - name: Test persistent successor-lease recovery proposals
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_recovery_ledger.py'
      - name: Test fail-closed principal attestation contract
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_principal_contract.py'
      - name: Test persistent principal nonce replay protection
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_principal_replay_ledger.py'
      - name: Test fail-closed principal trust-policy envelope
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_principal_trust_policy.py'
      - name: Test policy-bound principal verifier adapter
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_principal_policy_source.py'
      - name: Test persistent principal policy version and revocation history
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_principal_policy_ledger.py'
      - name: Test bounded company evidence integrity
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_evidence_verifier.py'
      - name: Test reviewer-attestation-bound evidence verification ledger
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_evidence_ledger.py'
      - name: Test deterministic unified-ledger integrity checkpoint
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_ledger_integrity_snapshot.py'
      - name: Test metadata-only ledger restore equivalence
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_ledger_restore_verifier.py'
      - name: Test bounded metadata-only backup inventory and retention
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_backup_inventory.py'
      - name: Test cross-ledger backup-set lineage reconciliation
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_backup_set_reconciliation.py'
      - name: Test cross-ledger backup-set restore equivalence
        run: python -m unittest discover -s tests -p 'test_enterprise_hq_backup_set_restore_verifier.py'
      - name: Read private HQ metadata and emit aggregate-only report
        env:
          ENTERPRISE_HQ_READ_TOKEN: ${{ secrets.ENTERPRISE_HQ_READ_TOKEN }}
        run: python scripts/enterprise_hq_company_observer.py --output "$RUNNER_TEMP/enterprise-hq-company-summary.json"
      - name: Store aggregate-only report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-hq-parent-company-summary-${{ github.run_id }}
          path: ${{ runner.temp }}/enterprise-hq-company-summary.json
          if-no-files-found: ignore
          retention-days: 1
