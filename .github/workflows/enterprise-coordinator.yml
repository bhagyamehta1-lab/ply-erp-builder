name: Enterprise Coordinator Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enterprise-coordinator.yml'

permissions:
  contents: read

concurrency:
  group: enterprise-coordinator-gate
  cancel-in-progress: false

jobs:
  validate-hq-and-project-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HQ_BRIDGE_PAT: ${{ secrets.HQ_BRIDGE_PAT }}
    steps:
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate private HQ state and project registry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, pathlib, subprocess, sys, tempfile, urllib.request
          token = os.environ.get("HQ_BRIDGE_PAT", "")
          if not token:
              print("BRIDGE_NOT_CONFIGURED=YES")
              print("DISPATCH=NO (fail-closed)")
              raise SystemExit(0)
          repo = "bhagyamehta1-lab/PLY_ERP"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "enterprise-coordinator-gate",
          }
          def read_blob(path):
              url = f"https://api.github.com/repos/{repo}/contents/{path}?ref=main"
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=20) as response:
                  obj = json.loads(response.read().decode())
              return base64.b64decode(obj["content"])
          def read_json(path):
              return json.loads(read_blob(path).decode("utf-8"))
          state = read_json("state/pipeline_state.json")
          roadmap = read_json("state/enterprise_roadmap.json")
          orchestrator_source = read_blob("scripts/autonomous_orchestrator.py").decode("utf-8")
          compile(orchestrator_source, "scripts/autonomous_orchestrator.py", "exec")
          with tempfile.TemporaryDirectory() as temp_dir:
              temp = pathlib.Path(temp_dir)
              script_path = temp / "autonomous_orchestrator.py"
              state_path = temp / "pipeline_state.json"
              roadmap_path = temp / "enterprise_roadmap.json"
              script_path.write_text(orchestrator_source, encoding="utf-8")
              state_path.write_text(json.dumps(state), encoding="utf-8")
              roadmap_path.write_text(json.dumps(roadmap), encoding="utf-8")
              probe = subprocess.run(
                  [sys.executable, str(script_path), "--coordinate", "--state", str(state_path),
                   "--roadmap", str(roadmap_path), "--lock", str(temp / "coordinator.lock")],
                  capture_output=True, text=True, timeout=20
              )
              checked_state = json.loads(state_path.read_text(encoding="utf-8"))
              assert probe.returncode == 2 and "SAFE_HOLD:" in probe.stderr
              assert checked_state["system_status"] == "SAFE_HOLD"
              assert checked_state["execution_control"]["execution_hold"] is True
              assert checked_state["execution_control"]["dispatch_enabled"] is False
          print("HQ_ORCHESTRATOR_SYNTAX=PASS")
          print("HQ_ORCHESTRATOR_FAIL_CLOSED=PASS")
          hq = roadmap["repositories"]["enterprise_hq"]
          fleet = roadmap["repositories"]["public_worker_fleet"]
          p1 = next(p for p in roadmap["projects"] if p["project_id"] == "PROJECT-001")
          assert hq["repository"] == repo and hq["visibility"] == "PRIVATE"
          source_separation_ready = hq.get("contains_project_product_source") is False
          assert fleet["repository"] == "bhagyamehta1-lab/ply-erp-builder"
          assert fleet["repository"] != repo and fleet["visibility"] == "PUBLIC"
          project_repo = p1.get("repository")
          project_ready = bool(project_repo and project_repo not in (repo, fleet["repository"])
                               and p1.get("workspace"))
          gate = state["execution_control"]
          held = (state.get("system_status") == "SAFE_HOLD"
                  and gate.get("execution_hold") is True
                  and gate.get("dispatch_enabled") is False
                  and gate.get("state_lock") == "HELD")
          print("HQ_STATE_READ=PASS")
          print("HQ_PROJECT_BOUNDARY=PASS")
          print(f"HQ_SOURCE_SEPARATION_READY={'YES' if source_separation_ready else 'NO'}")
          print(f"PROJECT_001_PRIVATE_REPOSITORY_READY={'YES' if project_ready else 'NO'}")
          print(f"HQ_SAFE_HOLD={'YES' if held else 'NO'}")
          if held or not project_ready or not source_separation_ready:
              print("DISPATCH=NO (safe hold or project repository incomplete)")
              raise SystemExit(0)
          if not (gate.get("execution_hold") is False and gate.get("dispatch_enabled") is True
                  and gate.get("state_lock") == "OPEN"):
              raise SystemExit("Execution gate inconsistent; dispatch denied.")
          print("DISPATCH=NO (authenticated execution adapter still requires separate verification)")
          raise SystemExit(0)
          PY
