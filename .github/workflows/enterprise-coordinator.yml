name: Enterprise Coordinator Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enterprise-coordinator.yml'

permissions:
  contents: read

concurrency:
  group: enterprise-coordinator-gate
  cancel-in-progress: false

jobs:
  validate-hq-and-project-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HQ_BRIDGE_PAT: ${{ secrets.HQ_BRIDGE_PAT }}
    steps:
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate private HQ state and project registry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, urllib.request
          token = os.environ.get("HQ_BRIDGE_PAT", "")
          if not token:
              print("BRIDGE_NOT_CONFIGURED=YES")
              print("DISPATCH=NO (fail-closed)")
              raise SystemExit(0)
          repo = "bhagyamehta1-lab/PLY_ERP"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "enterprise-coordinator-gate",
          }
          def read_json(path):
              url = f"https://api.github.com/repos/{repo}/contents/{path}?ref=main"
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=20) as response:
                  obj = json.loads(response.read().decode())
              return json.loads(base64.b64decode(obj["content"]).decode("utf-8"))
          state = read_json("state/pipeline_state.json")
          roadmap = read_json("state/enterprise_roadmap.json")
          hq = roadmap["repositories"]["enterprise_hq"]
          fleet = roadmap["repositories"]["public_worker_fleet"]
          p1 = next(p for p in roadmap["projects"] if p["project_id"] == "PROJECT-001")
          assert hq["repository"] == repo and hq["visibility"] == "PRIVATE"
          assert hq["contains_project_product_source"] is False
          assert fleet["repository"] == "bhagyamehta1-lab/ply-erp-builder"
          assert fleet["repository"] != repo and fleet["visibility"] == "PUBLIC"
          project_repo = p1.get("repository")
          project_ready = bool(project_repo and project_repo not in (repo, fleet["repository"])
                               and p1.get("workspace"))
          gate = state["execution_control"]
          held = (state.get("system_status") == "SAFE_HOLD"
                  and gate.get("execution_hold") is True
                  and gate.get("dispatch_enabled") is False
                  and gate.get("state_lock") == "HELD")
          print("HQ_STATE_READ=PASS")
          print("HQ_PROJECT_BOUNDARY=PASS")
          print(f"PROJECT_001_PRIVATE_REPOSITORY_READY={'YES' if project_ready else 'NO'}")
          print(f"HQ_SAFE_HOLD={'YES' if held else 'NO'}")
          if held or not project_ready:
              print("DISPATCH=NO (safe hold or project repository incomplete)")
              raise SystemExit(0)
          if not (gate.get("execution_hold") is False and gate.get("dispatch_enabled") is True
                  and gate.get("state_lock") == "OPEN"):
              raise SystemExit("Execution gate inconsistent; dispatch denied.")
          print("DISPATCH=NO (authenticated execution adapter still requires separate verification)")
          raise SystemExit(0)
          PY
