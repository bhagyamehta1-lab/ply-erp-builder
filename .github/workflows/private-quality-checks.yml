name: Private ERP Quality Checks # validates draft voucher edit ID preservation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/private-quality-checks.yml

permissions:
  contents: read

concurrency:
  group: private-erp-quality-checks
  cancel-in-progress: true

jobs:
  quality:
    name: Private source quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout public builder
        uses: actions/checkout@v4

      - name: Checkout private ERP source
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SOURCE_REPOSITORY }}
          ref: fix/windows-android-build
          token: ${{ secrets.PRIVATE_PAT }}
          path: private-source
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update -qq >/dev/null 2>&1
          sudo apt-get install -y -qq \
            build-essential curl wget file libxdo-dev libssl-dev \
            librsvg2-dev libayatana-appindicator3-dev libwebkit2gtk-4.1-dev \
            >/dev/null 2>&1

      - name: Install frontend dependencies
        working-directory: private-source
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm install --no-audit --no-fund >/tmp/ply-npm-install.log 2>&1; then
              echo "Frontend dependency installation: PASSED"
              exit 0
            fi
            echo "Frontend dependency installation attempt $attempt failed."
            if [ "$attempt" -lt 3 ]; then
              sleep 10
            fi
          done
          echo "Frontend dependency installation: FAILED; diagnostic tail follows."
          tail -n 80 /tmp/ply-npm-install.log
          exit 1

      - name: TypeScript checks
        working-directory: private-source
        run: |
          if npm run typecheck >/tmp/ply-typecheck.log 2>&1; then
            echo "TypeScript typecheck: PASSED"
          else
            echo "TypeScript typecheck: FAILED (private compiler output suppressed)"
            exit 1
          fi

      - name: Frontend production build
        working-directory: private-source
        run: |
          if npm run build >/tmp/ply-frontend-build.log 2>&1; then
            echo "Frontend production build: PASSED"
          else
            echo "Frontend production build: FAILED (private compiler output suppressed)"
            exit 1
          fi

      - name: Normalize Rust formatting in temporary checkout
        working-directory: private-source
        shell: bash
        run: |
          if cargo fmt --manifest-path src-tauri/Cargo.toml --all >/tmp/ply-rustfmt-app.log 2>&1 &&
             cargo fmt --manifest-path native/storage-poc/Cargo.toml --all >/tmp/ply-rustfmt-poc.log 2>&1; then
            echo "Rust formatting normalized in temporary runner checkout only."
          else
            echo "Rust formatting command failed (private formatter output suppressed)"
            exit 1
          fi

      - name: Verify Rust formatting
        working-directory: private-source
        run: |
          if cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check >/tmp/ply-rustfmt-app-check.log 2>&1 &&
             cargo fmt --manifest-path native/storage-poc/Cargo.toml --all -- --check >/tmp/ply-rustfmt-poc-check.log 2>&1; then
            echo "Rust formatting checks: PASSED"
          else
            echo "Rust formatting checks: FAILED (private formatter output suppressed)"
            exit 1
          fi

      - name: SQLCipher storage proof-of-concept tests
        working-directory: private-source
        run: |
          if cargo test --manifest-path native/storage-poc/Cargo.toml >/tmp/ply-storage-tests.log 2>&1; then
            echo "SQLCipher storage tests: PASSED"
          else
            echo "SQLCipher storage tests: FAILED (private test output suppressed)"
            exit 1
          fi

      - name: Tauri application Rust tests
        working-directory: private-source
        run: |
          if cargo test --manifest-path src-tauri/Cargo.toml >/tmp/ply-tauri-tests.log 2>&1; then
            echo "Tauri Rust tests: PASSED"
          else
            echo "Tauri Rust tests: FAILED (private test output suppressed)"
            exit 1
          fi

      - name: Final result
        if: success()
        run: echo "All private ERP quality checks passed. No source files or build artifacts were uploaded."
