name: Public Worker Executor
# Task-scoped product verification and private CEO preview packaging; policy is enforced by DNA-first preflight.
# Optional GitHub Models advisory is scoped to sanitized HQ metadata; deterministic policy remains authoritative.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Worker mode"
        required: true
        type: choice
        options: [smoke_test, health_check, poll_hq, ceo_inbox_sync, execute_task]
      task_id:
        description: "Task ID (exact HQ policy and task-scoped grant required)"
        required: false
        type: string
  repository_dispatch:
    types: [enterprise_task]
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  actions: read
  models: read

concurrency:
  group: public-worker-executor
  cancel-in-progress: false

jobs:
  public-worker:
    name: Public CEO command and worker engine
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Enforce CEO audit SAFE_HOLD before downstream work
        id: safety_gate
        if: always()
        env:
          ENTERPRISE_HQ_READ_TOKEN: ${{ secrets.ENTERPRISE_HQ_READ_TOKEN || secrets.ENTERPRISE_HQ_WRITE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, urllib.error, urllib.request
          token = os.environ.get("ENTERPRISE_HQ_READ_TOKEN", "")
          if not token:
              print("CEO_AUDIT_GATE=DENY_CREDENTIAL_UNAVAILABLE")
              raise SystemExit("CEO audit state unavailable; fail closed before downstream work.")
          request = urllib.request.Request(
              "https://api.github.com/repos/bhagyamehta1-lab/Enterprise-HQ/contents/state/ceo_command_audit.json?ref=main",
              headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json",
                       "X-GitHub-Api-Version": "2022-11-28"})
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  payload = json.loads(response.read().decode("utf-8"))
              audit = json.loads(base64.b64decode(payload["content"]).decode("utf-8"))
          except Exception:
              print("CEO_AUDIT_GATE=DENY_AUDIT_UNAVAILABLE_OR_INVALID")
              raise SystemExit("CEO audit state unavailable or invalid; fail closed.")
          safety = audit.get("safety", {})
          hold = (audit.get("system_status") == "SAFE_HOLD"
                  or safety.get("safe_hold") is True
                  or safety.get("execution_hold") is True
                  or safety.get("builds_enabled") is not True
                  or safety.get("dispatch_enabled") is not True)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"safe_hold={'true' if hold else 'false'}\n")
          print("CEO_AUDIT_GATE=" + ("SAFE_HOLD" if hold else "ACTIVE_POLICY"))
          print("PRIVATE_SOURCE_CHECKOUT=NOT_PERFORMED_BY_GATE")
          PY

      - name: Check out public worker harness only
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create isolated shared-memory workspace
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 /dev/shm/enterprise_workspace
          echo "WORKSPACE=/dev/shm/enterprise_workspace" >> "$GITHUB_ENV"
          python --version

      - name: Load alignment DNA and enforce autonomous shift policy
        id: autonomy
        if: always()
        env:
          ENTERPRISE_HQ_READ_TOKEN: ${{ secrets.ENTERPRISE_HQ_READ_TOKEN || secrets.ENTERPRISE_HQ_WRITE_TOKEN }}
          ENTERPRISE_HQ_WRITE_TOKEN: ${{ secrets.ENTERPRISE_HQ_WRITE_TOKEN }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/autonomous_shift_runner.py scripts/ceo_hq_worker.py
          python scripts/autonomous_shift_runner.py preflight

      - name: Poll HQ and synchronize CEO inbox
        if: success() && steps.safety_gate.outputs.safe_hold != 'true' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'poll_hq' || inputs.mode == 'ceo_inbox_sync')))
        env:
          WORKSPACE: /dev/shm/enterprise_workspace
          CEO_WORKER_MODE: ceo_inbox_sync
          ENTERPRISE_HQ_READ_TOKEN: ${{ secrets.ENTERPRISE_HQ_READ_TOKEN || secrets.ENTERPRISE_HQ_WRITE_TOKEN }}
          ENTERPRISE_HQ_WRITE_TOKEN: ${{ secrets.ENTERPRISE_HQ_WRITE_TOKEN }}
          HQ_TO_PLY_ERP_TOKEN: ${{ secrets.HQ_TO_PLY_ERP_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          HQ_ENABLE_MODEL_BRAIN: "true"
          GH_MODELS_MODEL: "openai/gpt-4o-mini"
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ceo_hq_worker.py

      - name: Check out scoped private PLY ERP candidate into tmpfs
        id: private_checkout
        if: steps.autonomy.outputs.authorized == 'true'
        env:
          PLY_TOKEN: ${{ secrets.HQ_TO_PLY_ERP_TOKEN }}
          WORKSPACE: /dev/shm/enterprise_workspace
          CANDIDATE_BRANCH: ${{ steps.autonomy.outputs.candidate_branch }}
          BASELINE_SHA: ${{ steps.autonomy.outputs.baseline_sha }}
          CANDIDATE_SHA: ${{ steps.autonomy.outputs.candidate_sha }}
          FILE_ALLOWLIST_JSON: ${{ steps.autonomy.outputs.file_allowlist }}
          READ_FILE_ALLOWLIST_JSON: ${{ steps.autonomy.outputs.read_file_allowlist }}
          VERIFICATION_MODE: ${{ steps.autonomy.outputs.verification_mode }}
          TASK_ID: ${{ steps.autonomy.outputs.task_id }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PLY_TOKEN"
          AUTH="$(printf 'x-access-token:%s' "$PLY_TOKEN" | base64 -w0)"
          test -n "$CANDIDATE_BRANCH"
          test -n "$BASELINE_SHA"
          test -n "$READ_FILE_ALLOWLIST_JSON"
          git init --quiet "$WORKSPACE/PLY_ERP"
          cd "$WORKSPACE/PLY_ERP"
          git remote add origin https://github.com/bhagyamehta1-lab/PLY_ERP.git
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $AUTH"
          git fetch --quiet --filter=blob:none --depth 50 origin "$CANDIDATE_BRANCH"
          unset AUTH PLY_TOKEN
          test -n "$CANDIDATE_SHA"
          git cat-file -e "$CANDIDATE_SHA^{commit}"
          git sparse-checkout init --no-cone
          python - <<'PY'
          import json, os, pathlib
          allow = json.loads(os.environ["READ_FILE_ALLOWLIST_JSON"])
          if not allow or len(allow) != len(set(allow)):
              raise SystemExit("Read allowlist is empty or contains duplicates")
          if any(not isinstance(p,str) or not p or p.startswith("/") or ".." in pathlib.PurePosixPath(p).parts for p in allow):
              raise SystemExit("Read allowlist contains an unsafe path")
          pathlib.Path(os.environ["WORKSPACE"], "read-allowlist.txt").write_text(
              "\n".join("/" + p for p in allow) + "\n", encoding="utf-8")
          PY
          git sparse-checkout set --no-cone --stdin < "$WORKSPACE/read-allowlist.txt"
          git checkout --quiet --detach "$CANDIDATE_SHA"
          git config --local --unset-all http.https://github.com/.extraheader
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          python - <<'PY'
          import json, os, pathlib, subprocess
          mode = os.environ["VERIFICATION_MODE"]
          write_allowed = set(json.loads(os.environ["FILE_ALLOWLIST_JSON"]))
          read_allowed = set(json.loads(os.environ["READ_FILE_ALLOWLIST_JSON"]))
          tracked = set(subprocess.check_output(['git','ls-tree','-r','--name-only','HEAD'],text=True).splitlines())
          if not read_allowed or not write_allowed.issubset(read_allowed):
              raise SystemExit("Read allowlist must be non-empty and product writes must be a subset of reads")
          if mode == "PREVIEW_ONLY" and write_allowed:
              raise SystemExit("Preview-only tasks must have a zero-product-write boundary")
          if mode != "PREVIEW_ONLY" and not write_allowed:
              raise SystemExit("Implementation tasks require an explicit non-empty product write allowlist")
          if not read_allowed.issubset(tracked):
              raise SystemExit("Read allowlist contains paths missing from the candidate commit")
          materialized = {p.as_posix() for p in pathlib.Path(".").rglob("*")
                          if p.is_file() and ".git" not in p.parts}
          if materialized != read_allowed:
              raise SystemExit("Sparse checkout materialization differs from the exact read allowlist")
          if mode != "PREVIEW_ONLY":
              changed = set(subprocess.check_output(['git','diff','--name-only',os.environ["BASELINE_SHA"]+'...HEAD'],text=True).splitlines())
              if not changed or not changed.issubset(write_allowed):
                  raise SystemExit("Task changed files exceed the exact write allowlist")
              print("PLY_ERP_WRITE_ALLOWLIST=PASS")
          print("PLY_ERP_READ_ALLOWLIST=PASS")
          print("READ_ALLOWLIST_MATERIALIZED_COUNT=" + str(len(materialized)))
          print("PRIVATE_SOURCE_CONTENT_IN_LOGS=NO")
          PY
          git rev-parse HEAD > "$WORKSPACE/PLY_ERP_COMMIT_SHA"

      - name: Verify migration registration and frontend build
        id: frontend
        if: steps.autonomy.outputs.authorized == 'true'
        working-directory: /dev/shm/enterprise_workspace/PLY_ERP
        shell: bash
        run: |
          set -euo pipefail
          grep -q '005_inventory_movements_and_dispatch.sql' src-tauri/src/storage.rs
          grep -q 'let latest = 5i64' src-tauri/src/storage.rs
          grep -q 'LATEST_SCHEMA_VERSION.*5' src/platform/storage/contracts.ts
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
          npm run build

      - name: Verify SQL migrations and ledger queries
        id: sql
        if: steps.autonomy.outputs.authorized == 'true'
        working-directory: /dev/shm/enterprise_workspace/PLY_ERP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, sqlite3
          root=pathlib.Path('src/platform/storage/migrations'); db=sqlite3.connect(':memory:'); db.execute('PRAGMA foreign_keys=ON')
          for name in ['001_core_foundation.sql','002_production_work_vouchers.sql','003_flexible_production_masters.sql','004_documentation_organisation_knowledge.sql','005_inventory_movements_and_dispatch.sql']: db.executescript((root/name).read_text())
          db.execute("INSERT INTO inventory_items(id,item_code,item_name,category_code,base_unit) VALUES ('i1','RM-1','Resin','chemical','kg')")
          db.executemany("INSERT INTO inventory_movements(id,item_id,movement_date,movement_type,quantity,unit_code,source_type,source_id) VALUES (?,?,?,?,?,?,?,?)", [('m1','i1','2026-11-04','receipt',100,'kg','test','1'),('m2','i1','2026-11-04','production_consumption',12,'kg','test','2'),('m3','i1','2026-11-04','dispatch',8,'kg','test','3')])
          q=db.execute("SELECT SUM(CASE WHEN movement_type IN ('receipt','production_output','adjustment') THEN quantity WHEN movement_type IN ('issue','production_consumption','dispatch') THEN -quantity ELSE 0 END) FROM inventory_movements").fetchone()[0]
          assert q==80, q
          db.execute("INSERT INTO dispatch_orders(id,dispatch_no,dispatch_date,customer_name,status) VALUES ('d1','D-1','2026-11-04','Customer','pending')")
          assert db.execute("SELECT COUNT(*) FROM dispatch_orders WHERE status='pending'").fetchone()[0]==1
          print('SQL_MIGRATIONS_001_TO_005=PASS'); print('STOCK_AND_DISPATCH_AGGREGATION=PASS')
          PY

      - name: Install native Linux build prerequisites
        id: native_deps
        if: steps.autonomy.outputs.authorized == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Run Rust formatting and native tests
        id: rust
        if: steps.autonomy.outputs.authorized == 'true' && steps.autonomy.outputs.verification_mode != 'PREVIEW_ONLY'
        working-directory: /dev/shm/enterprise_workspace/PLY_ERP
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path src-tauri/Cargo.toml
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          grep -q 'stock_movement_insertion_records_receipt_and_issue' src-tauri/src/storage.rs
          grep -q 'negative_stock_is_rejected_without_inserting_issue' src-tauri/src/storage.rs
          grep -q 'dispatch_status_transitions_pending_to_dispatched_once' src-tauri/src/storage.rs
          cargo test --manifest-path src-tauri/Cargo.toml --lib -- --nocapture

      - name: Publish sanitized verification identity
        id: publish_identity
        if: steps.autonomy.outputs.authorized == 'true'
        env:
          TASK_ID: ${{ steps.autonomy.outputs.task_id }}
        shell: bash
        run: |
          set -euo pipefail
          echo "TASK_VERIFICATION=PASS"
          echo "TASK_ID=$TASK_ID"
          echo 'PRIVATE_SOURCE_CONTENT_IN_LOGS=NO'
          echo "VERIFIED_PLY_ERP_COMMIT=$(cat /dev/shm/enterprise_workspace/PLY_ERP_COMMIT_SHA)"

      - name: Package sanitized CEO preview bundle
        id: ceo_preview
        if: steps.autonomy.outputs.authorized == 'true' && steps.autonomy.outputs.verification_mode == 'PREVIEW_ONLY'
        working-directory: /dev/shm/enterprise_workspace/PLY_ERP
        env:
          WORKSPACE: /dev/shm/enterprise_workspace
          CANDIDATE_SHA: ${{ steps.autonomy.outputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -d dist
          mkdir -p "$WORKSPACE/CEO_PREVIEW"
          cp -a dist "$WORKSPACE/CEO_PREVIEW/dist"
          find "$WORKSPACE/CEO_PREVIEW/dist" -type f -name '*.map' -delete
          cat > "$WORKSPACE/CEO_PREVIEW/CEO_APP_WALKTHROUGH.md" <<'EOF'
          # PlyMetrix ERP — CEO App Walkthrough
          Candidate: ${{ steps.autonomy.outputs.candidate_sha }}

          ## Browser preview boundary
          This is the built Vite web UI. The production application is a Tauri desktop/Android app. Tauri invoke commands and encrypted local database operations require the installed native runtime and are not available in an ordinary browser preview. No real company records or database are included.

          ## Screens and navigation
          - Overview: dashboard summary cards for today's posted production, active inventory catalogue, stock-on-hand and dispatch status; local refresh and 30-second refresh. Native database required for live values.
          - Production: production work-voucher entry and production master/BOM setup surfaces. Some setup/BOM state is session-only and visibly marked as prototype until its database adapter is connected.
          - Inventory & Warehouse: choose Receipt or Issue, select item, quantity, date and notes, then Save stock movement; create dispatch order with dispatch number/customer/date/notes; Refresh; Mark dispatched. Native encrypted database required. Negative stock is rejected.
          - Documentation & Organisation: Documents, Staff & Org Chart, Work Tracking and Legal Cases tabs; current records are in component state, not yet persisted to the encrypted database.
          - AI Business Assistant: natural-language query mock UI and XLSX/PDF selection; it explicitly reports that local DB, document index and on-device AI/report services are not wired.
          - Procurement & Purchase, Products & Materials, Sales & CRM, Accounts & Finance, HR & Employees, Maintenance, Quality Management, Reports & Analytics: navigation placeholders; workflows are planned, not implemented.
          - Settings: visible sidebar control; no implemented settings route is wired.
          
          ## Key controls
          - Sidebar navigation buttons switch workspaces; mobile menu and close controls open/close navigation.
          - Dashboard refresh re-reads native summary; inventory successful writes dispatch a dashboard-refresh event.
          - Inventory form validates positive quantity and selected item; dispatch form requires dispatch number and customer; status action moves pending orders to dispatched once.
          - Documentation tabs switch local forms/lists; add-record controls update current component state only.
          - Assistant suggestion chips populate the prompt; submit returns a clear not-connected message rather than fabricated business data.
          
          ## Database tables in migrations 001–005
          The bundle includes no database file or customer data. Table names below are schema definitions only:
          EOF
          python - <<'PY'
          import pathlib, re
          root=pathlib.Path("src/platform/storage/migrations")
          names=[]
          for path in sorted(root.glob("00[1-5]_*.sql")):
              for name in re.findall(r"CREATE TABLE IF NOT EXISTS\s+([A-Za-z_][A-Za-z0-9_]*)",path.read_text(),re.I):
                  names.append((name,path.name))
          with open(pathlib.Path("/dev/shm/enterprise_workspace/CEO_PREVIEW/CEO_APP_WALKTHROUGH.md"),"a",encoding="utf-8") as f:
              for name,migration in names:
                  f.write(f"- {name} — {migration}\n")
          PY
          if find "$WORKSPACE/CEO_PREVIEW/dist" -type f \( -name '*.map' -o -name '*.tsx' -o -name '*.ts' \) | grep -q .; then
            echo "CEO_PREVIEW_SANITIZATION=FAIL"; exit 1
          fi
          echo "CEO_PREVIEW_BUNDLE=READY"
          echo "CEO_PREVIEW_SOURCE_MAPS=REMOVED"
          echo "PRIVATE_SOURCE_CONTENT_IN_PUBLIC_LOGS=NO"

      - name: Publish CEO preview to private Enterprise-HQ
        id: private_preview_publish
        if: steps.autonomy.outputs.authorized == 'true' && steps.autonomy.outputs.verification_mode == 'PREVIEW_ONLY' && steps.ceo_preview.outcome == 'success'
        env:
          ENTERPRISE_HQ_WRITE_TOKEN: ${{ secrets.ENTERPRISE_HQ_WRITE_TOKEN }}
          CANDIDATE_SHA: ${{ steps.autonomy.outputs.candidate_sha }}
          PREVIEW_DIR: /dev/shm/enterprise_workspace/CEO_PREVIEW
          GITHUB_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/publish_private_preview.py
          python scripts/publish_private_preview.py

      - name: Run harmless worker health verification
        shell: bash
        run: |
          set -euo pipefail
          test -d "$WORKSPACE"
          python - <<'PY'
          import os, pathlib, platform, sys
          workspace = pathlib.Path(os.environ["WORKSPACE"])
          assert sys.version_info[:2] == (3, 12), sys.version
          assert workspace.is_dir()
          probe = workspace / "worker_health_probe.py"
          probe.write_text("def health_check():\n    return 'WORKER_HEALTH_OK'\n", encoding="utf-8")
          compile(probe.read_text(encoding="utf-8"), str(probe), "exec")
          print("WORKER_HEALTH=PASS")
          print(f"PYTHON_VERSION={platform.python_version()}")
          print("PRIVATE_PAYLOADS_OR_SECRETS_IN_LOGS=NO")
          PY

      - name: Confirm a non-zero GitHub runner ID
        id: runner_identity
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['RUN_ID']}/jobs"
          req = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          with urllib.request.urlopen(req, timeout=20) as response:
              jobs = json.loads(response.read().decode()).get("jobs", [])
          current = next((j for j in jobs if j.get("name") == "Public CEO command and worker engine"), None)
          if not current or not isinstance(current.get("runner_id"), int) or current["runner_id"] <= 0:
              raise SystemExit("No valid non-zero public runner_id was returned.")
          print("RUNNER_ID_VERIFIED=PASS")
          print(f"RUNNER_ID={current['runner_id']}")
          print(f"RUNNER_NAME={current.get('runner_name', 'unreported')}")
          PY

      - name: Write sanitized QA checkpoint to Enterprise-HQ
        if: always() && steps.autonomy.outputs.authorized == 'true'
        env:
          ENTERPRISE_HQ_WRITE_TOKEN: ${{ secrets.ENTERPRISE_HQ_WRITE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          AUTONOMY_AUTHORIZED: ${{ steps.autonomy.outputs.authorized || 'false' }}
          AUTONOMY_TASK_ID: ${{ steps.autonomy.outputs.task_id || '' }}
          PRIVATE_CHECKOUT_OUTCOME: ${{ steps.private_checkout.outcome || 'skipped' }}
          READ_ALLOWLIST_OUTCOME: ${{ steps.private_checkout.outcome || 'skipped' }}
          READ_FILE_ALLOWLIST_JSON: ${{ steps.autonomy.outputs.read_file_allowlist || '[]' }}
          FRONTEND_OUTCOME: ${{ steps.frontend.outcome || 'skipped' }}
          SQL_OUTCOME: ${{ steps.sql.outcome || 'skipped' }}
          NATIVE_DEPS_OUTCOME: ${{ steps.native_deps.outcome || 'skipped' }}
          RUST_OUTCOME: ${{ steps.rust.outcome || 'skipped' }}
          PUBLISH_OUTCOME: ${{ steps.publish_identity.outcome || 'skipped' }}
          RUNNER_ID_OUTCOME: ${{ steps.runner_identity.outcome || 'skipped' }}
          VERIFICATION_MODE: ${{ steps.autonomy.outputs.verification_mode || 'NONE' }}
          PREVIEW_BUNDLE_OUTCOME: ${{ steps.ceo_preview.outcome || 'skipped' }}
          PREVIEW_ARTIFACT_OUTCOME: ${{ steps.private_preview_publish.outcome || 'skipped' }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/autonomous_shift_runner.py checkpoint

      - name: Wipe shared-memory workspace
        if: always()
        shell: bash
        run: |
          rm -rf /dev/shm/enterprise_workspace
          test ! -e /dev/shm/enterprise_workspace
          echo "SHARED_MEMORY_CLEANUP=PASS"
