name: Public Worker Executor

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Harmless verification, read-only HQ polling, or gated task request"
        required: true
        type: choice
        options: [smoke_test, health_check, poll_hq, execute_task]
      task_id:
        description: "Task ID (only used after enterprise hold is lifted)"
        required: false
        type: string
  repository_dispatch:
    types: [enterprise_task]
  push:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: public-worker-executor
  cancel-in-progress: false

jobs:
  isolated-worker:
    name: Isolated Python 3.12 worker verification
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Refuse task execution while enterprise is held
        if: (github.event_name == 'repository_dispatch' && github.event.client_payload.mode != 'smoke_test' && github.event.client_payload.mode != 'health_check') || inputs.mode == 'execute_task'
        run: |
          echo "::error::SAFE_HOLD — worker accepts smoke/health checks only; project task execution is disabled."
          echo "No private project source was fetched and no task was dispatched."
          exit 1
      - name: Check out public worker harness only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create isolated shared-memory workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /dev/shm/enterprise_workspace
          chmod 700 /dev/shm/enterprise_workspace
          echo "WORKSPACE=/dev/shm/enterprise_workspace" >> "$GITHUB_ENV"
          python --version
      - name: Run harmless health and Python compile verification
        shell: bash
        run: |
          set -euo pipefail
          test -d "$WORKSPACE"
          python - <<'PY'
          import os, pathlib, platform, sys
          workspace = pathlib.Path(os.environ["WORKSPACE"])
          assert sys.version_info[:2] == (3, 12), sys.version
          assert os.environ.get("GITHUB_ACTIONS") == "true"
          assert workspace.is_dir()
          probe = workspace / "worker_health_probe.py"
          probe.write_text("def health_check():\n    return 'WORKER_HEALTH_OK'\n", encoding="utf-8")
          py_compile = compile(probe.read_text(encoding="utf-8"), str(probe), "exec")
          namespace = {}
          exec(py_compile, namespace)
          assert namespace["health_check"]() == "WORKER_HEALTH_OK"
          repo = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          python_files = [p for p in repo.rglob("*.py") if ".git" not in p.parts]
          for source in python_files:
              compile(source.read_text(encoding="utf-8"), str(source), "exec")
          print("WORKER_HEALTH=PASS")
          print(f"PYTHON_VERSION={platform.python_version()}")
          print(f"PYTHON_FILES_COMPILED={len(python_files)}")
          print("PRIVATE_PROJECT_SOURCE_CHECKOUT=NO")
          print("TASK_DISPATCH=NO")
          PY
      - name: Confirm a non-zero GitHub runner ID
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['RUN_ID']}/jobs"
          req = urllib.request.Request(url, headers={"Authorization":f"Bearer {os.environ['GH_TOKEN']}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"})
          with urllib.request.urlopen(req, timeout=20) as response:
              jobs = json.loads(response.read().decode()).get("jobs", [])
          current = next((j for j in jobs if j.get("name") == "Isolated Python 3.12 worker verification"), None)
          if not current or not isinstance(current.get("runner_id"), int) or current["runner_id"] <= 0:
              raise SystemExit("No valid non-zero runner_id was returned for this job.")
          print("RUNNER_ID_VERIFIED=PASS")
          print(f"RUNNER_ID={current['runner_id']}")
          print(f"RUNNER_NAME={current.get('runner_name','unreported')}")
          PY
      - name: Wipe isolated shared-memory workspace
        if: always()
        shell: bash
        run: |
          rm -rf /dev/shm/enterprise_workspace
          test ! -e /dev/shm/enterprise_workspace
          echo "SHARED_MEMORY_CLEANUP=PASS"

  hq-command-poller:
    name: Enterprise HQ read-only command poller
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'poll_hq')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Poll private Enterprise-HQ state (read-only; never executes tasks)
        env:
          HQ_READ_TOKEN: ${{ secrets.ENTERPRISE_HQ_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$HQ_READ_TOKEN" ]; then
            echo "::error::ENTERPRISE_HQ_READ_TOKEN is not configured in ply-erp-builder Actions secrets."
            echo "Create a fine-grained credential with Contents: read on Enterprise-HQ only."
            exit 1
          fi
          python - <<'PY'
          import base64, json, os, urllib.request

          token = os.environ["HQ_READ_TOKEN"]
          base = "https://api.github.com/repos/bhagyamehta1-lab/Enterprise-HQ/contents/"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "ply-erp-builder-read-only-hq-poller",
          }

          def read_json(path):
              request = urllib.request.Request(base + path, headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  payload = json.loads(response.read().decode("utf-8"))
              return json.loads(base64.b64decode(payload["content"]).decode("utf-8"))

          roadmap = read_json("state/enterprise_roadmap.json")
          backlog = read_json("projects/ply_erp_backlog.json")
          safe_hold = (
              roadmap.get("status") == "SAFE_HOLD"
              and roadmap.get("safety", {}).get("execution_hold") is True
              and roadmap.get("safety", {}).get("dispatch_enabled") is False
              and roadmap.get("bridge", {}).get("dispatch_enabled") is False
              and backlog.get("enterprise_status") == "SAFE_HOLD"
          )
          queued = [
              item.get("task_id", "UNKNOWN")
              for item in backlog.get("requirements", [])
              if item.get("status") == "QUEUED_UNDER_HOLD"
          ]
          print(f"HQ_STATE={'SAFE_HOLD' if safe_hold else 'REQUIRES_MANUAL_REVIEW'}")
          print(f"QUEUED_REQUIREMENT_COUNT={len(queued)}")
          print("QUEUED_TASK_IDS=" + (",".join(queued) if queued else "NONE"))
          print("POLL_MODE=READ_ONLY")
          print("PRIVATE_PLY_ERP_SOURCE_FETCHED=NO")
          print("TASK_EXECUTION=DISABLED")
          if not safe_hold:
              print("ACTION=STOP_AND_REQUEST_MANUAL_REVIEW")
          PY
      - name: Verify the polling runner has a non-zero runner ID
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['RUN_ID']}/jobs"
          request = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          with urllib.request.urlopen(request, timeout=20) as response:
              jobs = json.loads(response.read().decode()).get("jobs", [])
          current = next((job for job in jobs if job.get("name") == "Enterprise HQ read-only command poller"), None)
          if not current or not isinstance(current.get("runner_id"), int) or current["runner_id"] <= 0:
              raise SystemExit("Read-only poller runner_id is missing or zero.")
          print("POLL_RUNNER_ID_VERIFIED=PASS")
          print(f"RUNNER_ID={current['runner_id']}")
          print(f"RUNNER_NAME={current.get('runner_name', 'unreported')}")
          PY
