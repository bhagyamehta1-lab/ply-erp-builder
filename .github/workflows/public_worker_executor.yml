name: Public Worker Executor

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Harmless verification or gated task request"
        required: true
        type: choice
        options: [smoke_test, health_check, execute_task]
      task_id:
        description: "Task ID (only used after enterprise hold is lifted)"
        required: false
        type: string
  repository_dispatch:
    types: [enterprise_task]
  push:

permissions:
  contents: read
  actions: read

concurrency:
  group: public-worker-executor
  cancel-in-progress: false

jobs:
  isolated-worker:
    name: Isolated Python 3.12 worker verification
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Refuse task execution while enterprise is held
        if: github.event_name == 'repository_dispatch' || inputs.mode == 'execute_task'
        run: |
          echo "::error::SAFE_HOLD — worker accepts smoke/health checks only; project task execution is disabled."
          echo "No private project source was fetched and no task was dispatched."
          exit 1
      - name: Check out public worker harness only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create isolated shared-memory workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /dev/shm/enterprise_workspace
          chmod 700 /dev/shm/enterprise_workspace
          echo "WORKSPACE=/dev/shm/enterprise_workspace" >> "$GITHUB_ENV"
          python --version
      - name: Run harmless health and Python compile verification
        shell: bash
        run: |
          set -euo pipefail
          test -d "$WORKSPACE"
          python - <<'PY'
          import os, pathlib, platform, sys
          workspace = pathlib.Path(os.environ["WORKSPACE"])
          assert sys.version_info[:2] == (3, 12), sys.version
          assert os.environ.get("GITHUB_ACTIONS") == "true"
          assert workspace.is_dir()
          probe = workspace / "worker_health_probe.py"
          probe.write_text("def health_check():\n    return 'WORKER_HEALTH_OK'\n", encoding="utf-8")
          py_compile = compile(probe.read_text(encoding="utf-8"), str(probe), "exec")
          namespace = {}
          exec(py_compile, namespace)
          assert namespace["health_check"]() == "WORKER_HEALTH_OK"
          repo = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          python_files = [p for p in repo.rglob("*.py") if ".git" not in p.parts]
          for source in python_files:
              compile(source.read_text(encoding="utf-8"), str(source), "exec")
          print("WORKER_HEALTH=PASS")
          print(f"PYTHON_VERSION={platform.python_version()}")
          print(f"PYTHON_FILES_COMPILED={len(python_files)}")
          print("PRIVATE_PROJECT_SOURCE_CHECKOUT=NO")
          print("TASK_DISPATCH=NO")
          PY
      - name: Confirm a non-zero GitHub runner ID
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['RUN_ID']}/jobs"
          req = urllib.request.Request(url, headers={"Authorization":f"Bearer {os.environ['GH_TOKEN']}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"})
          with urllib.request.urlopen(req, timeout=20) as response:
              jobs = json.loads(response.read().decode()).get("jobs", [])
          current = next((j for j in jobs if j.get("name") == "Isolated Python 3.12 worker verification"), None)
          if not current or not isinstance(current.get("runner_id"), int) or current["runner_id"] <= 0:
              raise SystemExit("No valid non-zero runner_id was returned for this job.")
          print("RUNNER_ID_VERIFIED=PASS")
          print(f"RUNNER_ID={current['runner_id']}")
          print(f"RUNNER_NAME={current.get('runner_name','unreported')}")
          PY
      - name: Wipe isolated shared-memory workspace
        if: always()
        shell: bash
        run: |
          rm -rf /dev/shm/enterprise_workspace
          test ! -e /dev/shm/enterprise_workspace
          echo "SHARED_MEMORY_CLEANUP=PASS"
