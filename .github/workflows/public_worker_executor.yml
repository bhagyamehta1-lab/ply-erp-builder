name: Public Worker Executor
# Optional GitHub Models advisory is scoped to sanitized HQ metadata; deterministic policy remains authoritative.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Worker mode"
        required: true
        type: choice
        options: [smoke_test, health_check, poll_hq, ceo_inbox_sync, execute_task]
      task_id:
        description: "Task ID (product execution remains blocked under SAFE_HOLD)"
        required: false
        type: string
  repository_dispatch:
    types: [enterprise_task]
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  actions: read
  models: read

concurrency:
  group: public-worker-executor
  cancel-in-progress: false

jobs:
  public-worker:
    name: Public CEO command and worker engine
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Enforce SAFE_HOLD task gate
        if: (github.event_name == 'workflow_dispatch' && inputs.mode == 'execute_task') || (github.event_name == 'repository_dispatch' && github.event.client_payload.mode != 'smoke_test' && github.event.client_payload.mode != 'health_check')
        shell: bash
        run: |
          echo "::error::SAFE_HOLD — product task execution is disabled."
          echo "No private PLY_ERP source was fetched and no product task was dispatched."
          exit 1

      - name: Check out public worker harness only
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create isolated shared-memory workspace
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 /dev/shm/enterprise_workspace
          echo "WORKSPACE=/dev/shm/enterprise_workspace" >> "$GITHUB_ENV"
          python --version

      - name: Load alignment DNA and enforce autonomous shift policy
        id: autonomy
        if: always()
        env:
          ENTERPRISE_HQ_READ_TOKEN: ${{ secrets.ENTERPRISE_HQ_READ_TOKEN || secrets.ENTERPRISE_HQ_WRITE_TOKEN }}
          ENTERPRISE_HQ_WRITE_TOKEN: ${{ secrets.ENTERPRISE_HQ_WRITE_TOKEN }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/autonomous_shift_runner.py
          python scripts/autonomous_shift_runner.py preflight

      - name: Poll HQ and synchronize CEO inbox
        if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'poll_hq' || inputs.mode == 'ceo_inbox_sync')
        env:
          WORKSPACE: /dev/shm/enterprise_workspace
          CEO_WORKER_MODE: ceo_inbox_sync
          ENTERPRISE_HQ_READ_TOKEN: ${{ secrets.ENTERPRISE_HQ_READ_TOKEN || secrets.ENTERPRISE_HQ_WRITE_TOKEN }}
          ENTERPRISE_HQ_WRITE_TOKEN: ${{ secrets.ENTERPRISE_HQ_WRITE_TOKEN }}
          HQ_TO_PLY_ERP_TOKEN: ${{ secrets.HQ_TO_PLY_ERP_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          HQ_ENABLE_MODEL_BRAIN: "true"
          GH_MODELS_MODEL: "openai/gpt-4o-mini"
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ceo_hq_worker.py

      - name: Check out scoped private PLY ERP candidate into tmpfs
        id: private_checkout
        if: steps.autonomy.outputs.authorized == 'true'
        env:
          PLY_TOKEN: ${{ secrets.HQ_TO_PLY_ERP_TOKEN }}
          WORKSPACE: /dev/shm/enterprise_workspace
          CANDIDATE_BRANCH: ${{ steps.autonomy.outputs.candidate_branch }}
          BASELINE_SHA: ${{ steps.autonomy.outputs.baseline_sha }}
          TASK_ID: ${{ steps.autonomy.outputs.task_id }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PLY_TOKEN"
          AUTH="$(printf 'x-access-token:%s' "$PLY_TOKEN" | base64 -w0)"
          test -n "$CANDIDATE_BRANCH"
          test -n "$BASELINE_SHA"
          git -c "http.extraheader=AUTHORIZATION: basic $AUTH" clone --quiet --depth 50 --branch "$CANDIDATE_BRANCH" https://github.com/bhagyamehta1-lab/PLY_ERP.git "$WORKSPACE/PLY_ERP"
          unset AUTH PLY_TOKEN
          cd "$WORKSPACE/PLY_ERP"
          git cat-file -e "$BASELINE_SHA^{commit}"
          python - <<'PY'
          import os, subprocess
          task = os.environ["TASK_ID"]
          if task != "PLY-0002": raise SystemExit("Unsupported scoped task ID")
          allowed = {'src/platform/storage/contracts.ts','src-tauri/src/storage.rs','src-tauri/src/lib.rs','src/components/DashboardSummary.tsx','src/App.tsx','src/styles.css','src/components/InventoryDispatchManager.tsx'}
          changed = set(subprocess.check_output(['git','diff','--name-only',os.environ["BASELINE_SHA"]+'...HEAD'],text=True).splitlines())
          if not changed or not changed.issubset(allowed): raise SystemExit('PLY-0002 file allowlist validation failed')
          required = allowed
          tracked = set(subprocess.check_output(['git','ls-tree','-r','--name-only','HEAD'],text=True).splitlines())
          if not required.issubset(tracked): raise SystemExit('Required PLY-0002 implementation files missing')
          print('PLY_ERP_FILE_ALLOWLIST=PASS')
          print('PRIVATE_SOURCE_CONTENT_IN_LOGS=NO')
          PY
          git rev-parse HEAD > "$WORKSPACE/PLY_ERP_COMMIT_SHA"

      - name: Verify migration registration and frontend build
        id: frontend
        if: steps.autonomy.outputs.authorized == 'true'
        working-directory: /dev/shm/enterprise_workspace/PLY_ERP
        shell: bash
        run: |
          set -euo pipefail
          grep -q '005_inventory_movements_and_dispatch.sql' src-tauri/src/storage.rs
          grep -q 'let latest = 5i64' src-tauri/src/storage.rs
          grep -q 'LATEST_SCHEMA_VERSION.*5' src/platform/storage/contracts.ts
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
          npm run build

      - name: Verify SQL migrations and ledger queries
        id: sql
        if: steps.autonomy.outputs.authorized == 'true'
        working-directory: /dev/shm/enterprise_workspace/PLY_ERP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, sqlite3
          root=pathlib.Path('src/platform/storage/migrations'); db=sqlite3.connect(':memory:'); db.execute('PRAGMA foreign_keys=ON')
          for name in ['001_core_foundation.sql','002_production_work_vouchers.sql','003_flexible_production_masters.sql','004_documentation_organisation_knowledge.sql','005_inventory_movements_and_dispatch.sql']: db.executescript((root/name).read_text())
          db.execute("INSERT INTO inventory_items(id,item_code,item_name,category_code,base_unit) VALUES ('i1','RM-1','Resin','chemical','kg')")
          db.executemany("INSERT INTO inventory_movements(id,item_id,movement_date,movement_type,quantity,unit_code,source_type,source_id) VALUES (?,?,?,?,?,?,?,?)", [('m1','i1','2026-11-04','receipt',100,'kg','test','1'),('m2','i1','2026-11-04','production_consumption',12,'kg','test','2'),('m3','i1','2026-11-04','dispatch',8,'kg','test','3')])
          q=db.execute("SELECT SUM(CASE WHEN movement_type IN ('receipt','production_output','adjustment') THEN quantity WHEN movement_type IN ('issue','production_consumption','dispatch') THEN -quantity ELSE 0 END) FROM inventory_movements").fetchone()[0]
          assert q==80, q
          db.execute("INSERT INTO dispatch_orders(id,dispatch_no,dispatch_date,customer_name,status) VALUES ('d1','D-1','2026-11-04','Customer','pending')")
          assert db.execute("SELECT COUNT(*) FROM dispatch_orders WHERE status='pending'").fetchone()[0]==1
          print('SQL_MIGRATIONS_001_TO_005=PASS'); print('STOCK_AND_DISPATCH_AGGREGATION=PASS')
          PY

      - name: Install native Linux build prerequisites
        id: native_deps
        if: steps.autonomy.outputs.authorized == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Run Rust formatting and native tests
        id: rust
        if: steps.autonomy.outputs.authorized == 'true'
        working-directory: /dev/shm/enterprise_workspace/PLY_ERP
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path src-tauri/Cargo.toml
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          grep -q 'stock_movement_insertion_records_receipt_and_issue' src-tauri/src/storage.rs
          grep -q 'negative_stock_is_rejected_without_inserting_issue' src-tauri/src/storage.rs
          grep -q 'dispatch_status_transitions_pending_to_dispatched_once' src-tauri/src/storage.rs
          cargo test --manifest-path src-tauri/Cargo.toml --lib -- --nocapture

      - name: Publish sanitized verification identity
        id: publish_identity
        if: steps.autonomy.outputs.authorized == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo 'PLY_0002_QA=PASS'
          echo 'PRIVATE_SOURCE_CONTENT_IN_LOGS=NO'
          echo "VERIFIED_PLY_ERP_COMMIT=$(cat /dev/shm/enterprise_workspace/PLY_ERP_COMMIT_SHA)"
      - name: Run harmless worker health verification
        shell: bash
        run: |
          set -euo pipefail
          test -d "$WORKSPACE"
          python - <<'PY'
          import os, pathlib, platform, sys
          workspace = pathlib.Path(os.environ["WORKSPACE"])
          assert sys.version_info[:2] == (3, 12), sys.version
          assert workspace.is_dir()
          probe = workspace / "worker_health_probe.py"
          probe.write_text("def health_check():\n    return 'WORKER_HEALTH_OK'\n", encoding="utf-8")
          compile(probe.read_text(encoding="utf-8"), str(probe), "exec")
          print("WORKER_HEALTH=PASS")
          print(f"PYTHON_VERSION={platform.python_version()}")
          print("PRIVATE_PAYLOADS_OR_SECRETS_IN_LOGS=NO")
          PY

      - name: Confirm a non-zero GitHub runner ID
        id: runner_identity
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['RUN_ID']}/jobs"
          req = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          with urllib.request.urlopen(req, timeout=20) as response:
              jobs = json.loads(response.read().decode()).get("jobs", [])
          current = next((j for j in jobs if j.get("name") == "Public CEO command and worker engine"), None)
          if not current or not isinstance(current.get("runner_id"), int) or current["runner_id"] <= 0:
              raise SystemExit("No valid non-zero public runner_id was returned.")
          print("RUNNER_ID_VERIFIED=PASS")
          print(f"RUNNER_ID={current['runner_id']}")
          print(f"RUNNER_NAME={current.get('runner_name', 'unreported')}")
          PY

      - name: Write sanitized QA checkpoint to Enterprise-HQ
        if: always() && steps.autonomy.outputs.authorized == 'true'
        env:
          ENTERPRISE_HQ_WRITE_TOKEN: ${{ secrets.ENTERPRISE_HQ_WRITE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          AUTONOMY_AUTHORIZED: ${{ steps.autonomy.outputs.authorized || 'false' }}
          AUTONOMY_TASK_ID: ${{ steps.autonomy.outputs.task_id || '' }}
          PRIVATE_CHECKOUT_OUTCOME: ${{ steps.private_checkout.outcome || 'skipped' }}
          FRONTEND_OUTCOME: ${{ steps.frontend.outcome || 'skipped' }}
          SQL_OUTCOME: ${{ steps.sql.outcome || 'skipped' }}
          NATIVE_DEPS_OUTCOME: ${{ steps.native_deps.outcome || 'skipped' }}
          RUST_OUTCOME: ${{ steps.rust.outcome || 'skipped' }}
          PUBLISH_OUTCOME: ${{ steps.publish_identity.outcome || 'skipped' }}
          RUNNER_ID_OUTCOME: ${{ steps.runner_identity.outcome || 'skipped' }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/autonomous_shift_runner.py checkpoint

      - name: Wipe shared-memory workspace
        if: always()
        shell: bash
        run: |
          rm -rf /dev/shm/enterprise_workspace
          test ! -e /dev/shm/enterprise_workspace
          echo "SHARED_MEMORY_CLEANUP=PASS"
