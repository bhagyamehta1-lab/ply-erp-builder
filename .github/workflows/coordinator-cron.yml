name: Hourly CI Coordinator

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      force_dispatch:
        description: 'Force dispatch to all 10 builders regardless of existing statuses'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: plymetrix-hourly-coordinator
  cancel-in-progress: false

jobs:
  poll-and-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve latest private main commit
        id: target
        env:
          READ_TOKEN: ${{ secrets.PRIVATE_ERP_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o "$RUNNER_TEMP/commit.json" -w '%{http_code}' \\
            -H "Authorization: Bearer $READ_TOKEN" \\
            -H "Accept: application/vnd.github+json" \\
            https://api.github.com/repos/bhagyamehta1-lab/PLY_ERP/commits/main)
          if [[ "$code" != "200" ]]; then
            echo "Private ERP commit lookup failed (HTTP $code)."
            exit 1
          fi
          sha=$(jq -r '.sha // empty' "$RUNNER_TEMP/commit.json")
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid commit SHA returned."; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Target private ERP commit: $sha"

      - name: Read current commit statuses
        env:
          STATUS_TOKEN: ${{ secrets.PRIVATE_ERP_STATUS_TOKEN }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o "$RUNNER_TEMP/statuses.json" -w '%{http_code}' \\
            -H "Authorization: Bearer $STATUS_TOKEN" \\
            -H "Accept: application/vnd.github+json" \\
            "https://api.github.com/repos/bhagyamehta1-lab/PLY_ERP/commits/$SHA/statuses")
          if [[ "$code" != "200" ]]; then
            echo "Could not read private commit statuses (HTTP $code)."
            exit 1
          fi
          jq -r '.[].context' "$RUNNER_TEMP/statuses.json" | sort -u > "$RUNNER_TEMP/contexts.txt"

      - name: Dispatch missing or retryable worker lanes
        env:
          DISPATCH_TOKEN: ${{ secrets.PUBLIC_BUILDERS_DISPATCH_TOKEN }}
          STATUS_TOKEN: ${{ secrets.PRIVATE_ERP_STATUS_TOKEN }}
          SHA: ${{ steps.target.outputs.sha }}
          FORCE_DISPATCH: ${{ github.event_name == 'workflow_dispatch' && inputs.force_dispatch || false }}
        shell: bash
        run: |
          set -euo pipefail
          declare -a REPOS=(
            "ply-erp-builder"
            "ply-erp-builder-2"
            "ply-erp-builder-3"
            "ply-erp-builder-4"
            "ply-erp-builder-5"
            "ply-erp-builder-6"
            "ply-erp-builder-7"
            "ply-erp-builder-8"
            "ply-erp-builder-9"
            "ply-erp-builder-10"
          )
          declare -a SUITES=(
            "frontend-typecheck"
            "frontend-build"
            "tauri-rust-tests"
            "storage-poc-tests"
            "windows-frontend-build"
            "rust-format-check"
            "cargo-metadata"
            "frontend-and-rust"
            "dependency-tree-check"
            "acceptance-smoke"
          )

          now=$(date -u +%s)
          echo "Force dispatch: $FORCE_DISPATCH"
          for i in "${!REPOS[@]}"; do
            repo="${REPOS[$i]}"
            suite="${SUITES[$i]}"
            context="ci-bridge/$suite"
            # Manual force-dispatch bypasses both successful and recent-pending
            # status checks so all ten diagnostic lanes execute for this SHA.
            status=$(jq -r --arg c "$context" '[.[] | select(.context==$c)] | first // {} | .state // "missing"' "$RUNNER_TEMP/statuses.json")
            updated=$(jq -r --arg c "$context" '[.[] | select(.context==$c)] | first // {} | .updated_at // ""' "$RUNNER_TEMP/statuses.json")
            if [[ "$FORCE_DISPATCH" != "true" && "$status" == "success" ]]; then
              echo "$suite already passed for $SHA; skipping."
              continue
            fi
            if [[ "$FORCE_DISPATCH" != "true" && "$status" == "pending" && -n "$updated" ]]; then
              updated_epoch=$(date -u -d "$updated" +%s 2>/dev/null || echo 0)
              if (( now - updated_epoch < 5400 )); then
                echo "$suite is already pending; skipping duplicate dispatch."
                continue
              fi
            fi
            payload=$(jq -nc --arg sha "$SHA" --arg repo "$repo" --arg suite "$suite" \\
              '{event_type:"plymetrix-ci",client_payload:{private_repo:"bhagyamehta1-lab/PLY_ERP",commit_sha:$sha,builder_repo:$repo,suite:$suite}}')
            code=$(curl -sS -o "$RUNNER_TEMP/dispatch-$i.json" -w '%{http_code}' \\
              -X POST \\
              -H "Authorization: Bearer $DISPATCH_TOKEN" \\
              -H "Accept: application/vnd.github+json" \\
              -H "X-GitHub-Api-Version: 2022-11-28" \\
              "https://api.github.com/repos/bhagyamehta1-lab/$repo/dispatches" \\
              -d "$payload")
            if [[ "$code" != "204" ]]; then
              echo "Dispatch failed for $repo (HTTP $code)."
              exit 1
            fi
            echo "Dispatched $suite to $repo."
          done
