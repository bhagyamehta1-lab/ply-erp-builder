name: Domain tests
# Parallel verification refresh: 2026-11-01
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  domain-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run domain tests
        run: node --test src/*.test.mjs

      - name: Run worker telemetry unit tests
        run: |
          python -m py_compile scripts/worker_telemetry.py scripts/autonomous_shift_runner.py
          python -m unittest discover -s tests -p 'test_worker_telemetry.py' -v
