name: Domain tests
# Parallel verification refresh: 2026-11-01
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  domain-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run domain tests
        run: node --test src/*.test.mjs
      - name: Validate CEO governance writer safety guards
        run: |
          python -m py_compile scripts/ceo_hq_worker.py
          python -c "import runpy; ns=runpy.run_path('scripts/ceo_hq_worker.py'); ns['self_test_write_path_guards']()"
