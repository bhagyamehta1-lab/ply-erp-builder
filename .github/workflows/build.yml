name: Desktop and Mobile Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Windows Build
    runs-on: windows-latest
    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SOURCE_REPOSITORY }}
          ref: fix/windows-android-build
          token: ${{ secrets.PRIVATE_PAT }}
          path: source
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        working-directory: source
        run: npm install

      - name: Build executable
        working-directory: source
        run: npm run tauri:build -- --no-bundle

      - name: Publish private release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_PAT }}
          TARGET_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
        run: |
          $exe = Get-ChildItem "source/src-tauri/target/release" -Filter "*.exe" -File |
            Where-Object { $_.Name -notmatch "uninstall" } |
            Select-Object -First 1
          if (-not $exe) { throw "Executable not found" }
          $tag = "desktop-$env:GITHUB_RUN_NUMBER"
          gh release create $tag $exe.FullName --repo $env:TARGET_REPOSITORY --title "Desktop build $env:GITHUB_RUN_NUMBER" --notes "Automated desktop build."

  mobile:
    name: Android Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SOURCE_REPOSITORY }}
          ref: fix/windows-android-build
          token: ${{ secrets.PRIVATE_PAT }}
          path: source
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android SDK platform and NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"

      - name: Configure Android NDK
        run: |
          NDK_BIN="$ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "$NDK_BIN" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          ln -sf "$NDK_BIN/llvm-ar" "$NDK_BIN/aarch64-linux-android-ar"
          ln -sf "$NDK_BIN/llvm-ranlib" "$NDK_BIN/aarch64-linux-android-ranlib"
          ln -sf "$NDK_BIN/llvm-strip" "$NDK_BIN/aarch64-linux-android-strip"
          echo "AR_aarch64_linux_android=$NDK_BIN/llvm-ar" >> "$GITHUB_ENV"
          echo "RANLIB_aarch64_linux_android=$NDK_BIN/llvm-ranlib" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$NDK_BIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install dependencies
        working-directory: source
        run: npm install

      - name: Initialize mobile project
        working-directory: source
        run: npm run tauri:android:init -- --ci

      - name: Build Android package
        working-directory: source
        run: npm run tauri:android:build -- --target aarch64 --apk --ci

      - name: Collect Android build failure details
        if: failure()
        shell: bash
        run: |
          echo "=== Android build failure summary ==="
          for dir in \
            source/src-tauri/gen/android/app/build/reports \
            source/src-tauri/gen/android/build/reports \
            source/src-tauri/target
          do
            if [ -d "$dir" ]; then
              find "$dir" -type f \\( -name "*.txt" -o -name "*.log" -o -name "*.html" \\) -print
            fi
          done
          echo "=== Matching error lines from Gradle daemon logs ==="
          if [ -d "$HOME/.gradle/daemon" ]; then
            grep -R -n -E -i -C 3 \
              "FAILURE:|What went wrong:|Execution failed|Caused by:|error:|error\\[|could not|failed to" \
              "$HOME/.gradle/daemon" --include="*.out.log" 2>/dev/null | tail -n 160 || true
          fi
          echo "=== Matching error lines from generated text reports/logs ==="
          find source/src-tauri/gen/android source/src-tauri/target \
            -type f \\( -name "*.txt" -o -name "*.log" \\) -print0 2>/dev/null |
            xargs -0 -r grep -n -E -i -C 2 \
              "FAILURE:|What went wrong:|Execution failed|Caused by:|error:|error\\[|could not|failed to" 2>/dev/null |
            tail -n 160 || true

      - name: Sign package with temporary test key
        working-directory: source
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/build-test.keystore" \
            -storepass android \
            -alias build-test \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Build Test, OU=Development, O=Build, L=NA, ST=NA, C=US"

          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          while IFS= read -r -d '' apk; do
            signed="${apk%.apk}-signed.apk"
            "$APKSIGNER" sign \
              --ks "$RUNNER_TEMP/build-test.keystore" \
              --ks-key-alias build-test \
              --ks-pass pass:android \
              --key-pass pass:android \
              --out "$signed" "$apk"
            "$APKSIGNER" verify --verbose "$signed"
          done < <(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -print0)

      - name: Publish private release
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_PAT }}
          TARGET_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
        run: |
          APK="$(find source/src-tauri/gen/android/app/build/outputs/apk -type f -name '*-signed.apk' -print -quit)"
          test -n "$APK"
          gh release create "mobile-$GITHUB_RUN_NUMBER" "$APK" \
            --repo "$TARGET_REPOSITORY" \
            --title "Mobile build $GITHUB_RUN_NUMBER" \
            --notes "Automated Android test-signed build."
