name: Build Windows EXE and Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-private-apps.yml

permissions:
  contents: read

concurrency:
  group: private-erp-app-builds
  cancel-in-progress: false

jobs:
  windows:
    name: Windows NSIS installer
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout public builder
        uses: actions/checkout@v4

      - name: Checkout private ERP source
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SOURCE_REPOSITORY }}
          ref: fix/native-platform-readonly-integration
          token: ${{ secrets.PRIVATE_PAT }}
          path: private-source
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Install frontend dependencies
        working-directory: private-source
        run: npm install --no-audit --no-fund

      - name: Build Windows installer
        working-directory: private-source
        run: npm run tauri:build -- --bundles nsis

      - name: Install and launch Windows app smoke test
        shell: pwsh
        run: |
          $installer = Get-ChildItem "private-source/src-tauri/target/release/bundle/nsis" -Filter *.exe | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found" }
          $installDir = Join-Path $env:RUNNER_TEMP "PlyMetrixSmoke"
          Start-Process -FilePath $installer.FullName -ArgumentList @("/S", "/D=$installDir") -Wait
          $app = Get-ChildItem $installDir -Filter "*.exe" -Recurse | Where-Object { $_.Name -notmatch "uninstall" } | Select-Object -First 1
          if (-not $app) { throw "Installed application executable not found" }
          $proc = Start-Process -FilePath $app.FullName -PassThru
          Start-Sleep -Seconds 15
          $proc.Refresh()
          if ($proc.HasExited) { throw "PlyMetrix exited during startup (exit code $($proc.ExitCode))" }
          if (-not $proc.MainWindowHandle -or -not $proc.MainWindowTitle) { throw "PlyMetrix main window did not appear" }
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Windows smoke test passed: $($proc.MainWindowTitle)"
          Add-Type -AssemblyName System.Drawing
          Add-Type -AssemblyName System.Windows.Forms
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $bitmap.Save((Join-Path $env:RUNNER_TEMP "windows-smoke.png"))
          $graphics.Dispose(); $bitmap.Dispose()

      - name: Publish Windows installer and smoke screenshot to private ERP release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_PAT }}
          SOURCE_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
        run: |
          $installer = Get-ChildItem "private-source/src-tauri/target/release/bundle/nsis" -Filter *.exe | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found for private release" }
          $screenshot = Join-Path $env:RUNNER_TEMP "windows-smoke.png"
          if (-not (Test-Path $screenshot)) { throw "Windows smoke screenshot not found" }
          $sourceSha = (git -C private-source rev-parse HEAD).Trim()
          $tag = "ci-windows-$env:GITHUB_RUN_ID"
          gh release create $tag $installer.FullName $screenshot --repo $env:SOURCE_REPOSITORY --title "PlyMetrix Windows build $env:GITHUB_RUN_NUMBER" --notes "Windows installer and smoke screenshot. Built from source commit $sourceSha." --target $sourceSha
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish Windows assets to private ERP release" }

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout public builder
        uses: actions/checkout@v4

      - name: Checkout private ERP source
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SOURCE_REPOSITORY }}
          ref: fix/native-platform-readonly-integration
          token: ${{ secrets.PRIVATE_PAT }}
          path: private-source
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up stable Rust and Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install Android NDK tool aliases for OpenSSL
        shell: bash
        run: |
          NDK_BIN="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/ndk" -path '*/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib' -print -quit | xargs dirname)"
          if [ -z "$NDK_BIN" ] || [ ! -x "$NDK_BIN/llvm-ranlib" ]; then
            echo "Android NDK llvm-ranlib was not found"
            exit 1
          fi
          ln -sf "$NDK_BIN/llvm-ranlib" "$NDK_BIN/aarch64-linux-android-ranlib"
          echo "$NDK_BIN" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        working-directory: private-source
        run: npm install --no-audit --no-fund

      - name: Build debug APK
        working-directory: private-source
        run: npm run tauri:android:build -- --apk --debug

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Android emulator install and launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          emulator-boot-timeout: 300
          script: |
            adb wait-for-device
            test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
            adb shell input keyevent 82
            adb install -r /home/runner/work/ply-erp-builder/ply-erp-builder/private-source/src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
            adb shell am force-stop com.plymetrix.erp
            adb shell monkey -p com.plymetrix.erp -c android.intent.category.LAUNCHER 1
            sleep 20
            adb shell pidof com.plymetrix.erp
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | grep 'com.plymetrix.erp'
            ! adb logcat -d -t 3000 | grep -E 'FATAL EXCEPTION|Fatal signal' | grep -F 'com.plymetrix.erp'
            adb exec-out screencap -p > "$RUNNER_TEMP/android-smoke.png"

      - name: Publish Android APK and smoke screenshot to private ERP release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_PAT }}
          SOURCE_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
        run: |
          APK_PATH="private-source/src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk"
          test -f "$APK_PATH"
          test -f "$RUNNER_TEMP/android-smoke.png"
          SOURCE_SHA="$(git -C private-source rev-parse HEAD)"
          TAG="ci-android-$GITHUB_RUN_ID"
          gh release create "$TAG" "$APK_PATH" "$RUNNER_TEMP/android-smoke.png" --repo "$SOURCE_REPOSITORY" --title "PlyMetrix Android build $GITHUB_RUN_NUMBER" --notes "Android debug APK and emulator smoke screenshot. Built from source commit $SOURCE_SHA." --target "$SOURCE_SHA"

  post-smoke-validation:
    name: Post-smoke functional and privacy-safe checks
    needs: [windows, android]
    if: ${{ needs.windows.result == 'success' && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout private ERP source
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SOURCE_REPOSITORY }}
          ref: fix/native-platform-readonly-integration
          token: ${{ secrets.PRIVATE_PAT }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux native dependencies for Tauri Rust tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libglib2.0-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev
          pkg-config --modversion glib-2.0

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Frontend typecheck
        run: npm run typecheck

      - name: Frontend production build
        run: npm run build

      - name: Rust and local storage tests
        working-directory: src-tauri
        run: cargo test

      - name: Native storage proof-of-concept tests
        working-directory: native/storage-poc
        run: cargo test

      - name: Publish verification scope
        run: |
          {
            echo "## Post-smoke validation passed"
            echo "- Both Windows and Android build + launch smoke jobs succeeded before this job started."
            echo "- Frontend typecheck and production build passed."
            echo "- Rust application and native storage tests passed."
            echo "- This job uses source code and synthetic/local test fixtures only; it does not access production ERP records."
            echo "- Full business-module end-to-end workflows remain a separate test scope."
          } >> "$GITHUB_STEP_SUMMARY"
