name: Public Worker Fleet Connectivity Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/worker-fleet-connectivity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-fleet-connectivity-probe
  cancel-in-progress: false

jobs:
  ubuntu-runner-probe:
    name: Verify hosted Ubuntu runner and optional private HQ bridge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HQ_BRIDGE_PAT: ${{ secrets.HQ_BRIDGE_PAT }}
    steps:
      - name: Checkout public worker configuration
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Python environment and hosted runner
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 - <<'PY'
          import os, platform, sys
          assert sys.version_info >= (3, 12), sys.version
          assert os.environ.get("GITHUB_ACTIONS") == "true"
          assert os.environ.get("RUNNER_OS") == "Linux"
          assert os.environ.get("RUNNER_NAME"), "GitHub runner name is missing"
          print("PYTHON_ENVIRONMENT=PASS")
          print(f"PYTHON_VERSION={platform.python_version()}")
          print(f"RUNNER_OS={os.environ['RUNNER_OS']}")
          print(f"RUNNER_NAME={os.environ['RUNNER_NAME']}")
          print("No private HQ state or credentials were emitted.")
          PY

      - name: Verify private HQ SAFE_HOLD and write minimal receipt
        if: env.HQ_BRIDGE_PAT != ''
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_SHA: ${{ github.sha }}
          RUNNER_NAME: ${{ runner.name }}
          RUNNER_OS: ${{ runner.os }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, re, urllib.request
          repo = "bhagyamehta1-lab/PLY_ERP"
          token = os.environ["HQ_BRIDGE_PAT"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "enterprise-public-worker-probe",
          }
          def request(url, method="GET", body=None):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=20) as response:
                  return response.status, json.loads(response.read().decode())
          state_url = f"https://api.github.com/repos/{repo}/contents/state/pipeline_state.json?ref=main"
          _, blob = request(state_url)
          state = json.loads(base64.b64decode(blob["content"]).decode("utf-8"))
          gate = state.get("execution_control", {})
          if not (state.get("system_status") == "SAFE_HOLD"
                  and gate.get("execution_hold") is True
                  and gate.get("dispatch_enabled") is False
                  and gate.get("state_lock") == "HELD"):
              raise SystemExit("HQ gate is not in the expected fail-closed SAFE_HOLD state.")
          target_sha = state.get("base_sha")
          if not isinstance(target_sha, str) or not re.fullmatch(r"[0-9a-f]{40}", target_sha):
              raise SystemExit("HQ base SHA is missing or malformed; status receipt denied.")
          status_payload = {
              "state": "success",
              "context": "enterprise-worker/connectivity-probe",
              "description": "Public Ubuntu runner probe passed; HQ SAFE_HOLD retained",
              "target_url": f"https://github.com/bhagyamehta1-lab/ply-erp-builder/actions/runs/{os.environ['RUN_ID']}",
          }
          status_url = f"https://api.github.com/repos/{repo}/statuses/{target_sha}"
          request(status_url, method="POST", body=status_payload)
          print("HQ_STATE_READ=PASS")
          print("HQ_SAFE_HOLD_CONFIRMED=PASS")
          print("HQ_COMMIT_STATUS_WRITE=PASS")
          print("BUILDER_DISPATCHED=NO")
          PY
